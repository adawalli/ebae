name: release

# Publishes the GitHub Release (grouped notes from the commits since the last tag) for the
# same v*.*.* tags docker.yml builds the image from. The two run in parallel and never
# overlap: this one only writes release notes, it produces no artifacts.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # creating a release is a write to the repo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }} # preserve the annotated tag body instead of checking out its SHA
          fetch-depth: 0 # changelog diffs against the previous tag, so shallow won't do
      - name: Verify annotated tag
        run: test "$(git cat-file -t "$GITHUB_REF")" = tag
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
