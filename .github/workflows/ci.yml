name: ci

# The checks AGENTS.md asks for before a PR. docker.yml already builds the image on every PR,
# which catches type errors, but nothing ran the test suite - so a dependency bump could land
# with the suite entirely unexercised. Ordered cheapest-first so a failure reports quickly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # no secrets needed; dependency-update PRs run on the read-only token

# A new push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the whole job runs in well under a minute; this is a hang guard, not a budget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3" # matches the Docker installer
      - run: bun scripts/check-dependency-policy.mjs
      - name: Validate Renovate configuration
        uses: docker://renovate/renovate:44.181.1@sha256:823dc5036b911696c27faacf7664219b28e6e15826405720df29aad208d19f25
        with:
          args: renovate-config-validator --strict --no-global renovate.json
      # frozen: a lockfile that disagrees with package.json should fail here, not resolve silently
      - run: bun run install:deps --frozen-lockfile
      - run: bun run lint
      - run: bun test
      - run: bun run build
